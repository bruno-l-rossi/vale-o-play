<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 240px;
      margin: 0;
      padding: 14px 16px;
      background: #141414;
      color: #fff;
      font-family: "Netflix Sans", Helvetica, Arial, sans-serif;
      font-size: 13px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 15px;
    }
    h1 span { color: #e50914; }
    fieldset {
      border: 1px solid #333;
      border-radius: 6px;
      margin: 0 0 12px;
      padding: 8px 10px 10px;
    }
    legend {
      padding: 0 4px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #aaa;
    }
    label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 2px;
      cursor: pointer;
      border-radius: 4px;
    }
    label:hover { background: #222; }
    input[type="radio"] { accent-color: #e50914; margin: 0; }
    select {
      width: 100%;
      margin-top: 4px;
      padding: 5px 6px;
      background: #222;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
      font-size: 13px;
    }
    .hint {
      margin: 4px 0 0;
      font-size: 11px;
      color: #888;
      line-height: 1.4;
    }
    button {
      width: 100%;
      padding: 7px 0;
      background: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { background: #444; }
    #status {
      height: 14px;
      margin-top: 6px;
      font-size: 11px;
      color: #46d369;
      text-align: right;
    }
  </style>
</head>
<body>
  <h1>Vale o <span>Play</span>?</h1>

  <fieldset>
    <legend>Tamanho das notas</legend>
    <label><input type="radio" name="badgeSize" value="small" /> Pequeno</label>
    <label><input type="radio" name="badgeSize" value="medium" /> Médio (padrão)</label>
    <label><input type="radio" name="badgeSize" value="large" /> Grande</label>
  </fieldset>

  <fieldset>
    <legend>Posição na capa</legend>
    <label><input type="radio" name="badgePosition" value="top-left" /> Superior esquerdo (padrão)</label>
    <label><input type="radio" name="badgePosition" value="top-right" /> Superior direito</label>
    <label><input type="radio" name="badgePosition" value="bottom-left" /> Inferior esquerdo</label>
    <label><input type="radio" name="badgePosition" value="bottom-right" /> Inferior direito</label>
  </fieldset>

  <fieldset>
    <legend>Filtro de qualidade</legend>
    <select id="dimThreshold">
      <option value="off">Desligado (padrão)</option>
      <option value="40">Esmaecer abaixo de 40%</option>
      <option value="50">Esmaecer abaixo de 50%</option>
      <option value="60">Esmaecer abaixo de 60%</option>
      <option value="70">Esmaecer abaixo de 70%</option>
      <option value="80">Esmaecer abaixo de 80%</option>
    </select>
    <p class="hint">Escurece as capas com nota de críticos abaixo do corte. Passar o mouse devolve as cores.</p>
  </fieldset>

  <fieldset>
    <legend>Cache</legend>
    <button id="clearCache">Limpar cache de notas</button>
    <p class="hint">Força rebuscar todas as notas. Depois, recarregue a página da Netflix.</p>
  </fieldset>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
